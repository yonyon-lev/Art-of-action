<script>
(()=>{
'use strict';
const SEED=JSON.parse(document.getElementById('starter').textContent);
const KEY='yonyon-study-atlas-v1';
const TYPE={mcq:'רב־ברירה',tf:'נכון / לא נכון',short:'תשובה פתוחה',case:'קייס קליני'};
const CHAIN_LABEL={SBL:'SBL',SFL:'SFL',LL:'LL',SL:'SL',FL:'FL',DFL:'DFL'};
const TITLES={home:'מרחב הלמידה',library:'ספריית נושאים',practice:'תרגול שאלות',map:'מפת השרשראות',manage:'הוספת חומר',progress:'התקדמות',settings:'נתונים וגיבוי'};
let data=load();
let view={page:'home',subject:'struct',topic:null,quiz:null,practiceSubject:'struct',practiceTopic:'all',practiceType:'all',practiceMode:'all',selectedNode:'asis',selectedChain:'all',manageTab:'question',editId:null,search:'',libraryType:'all',resultInfo:null};
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.schemaVersion===1&&Array.isArray(d.questions))return d}catch(e){}return structuredClone(SEED)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('הדפדפן אינו מאפשר שמירה כרגע. בצע ייצוא גיבוי.');return false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function subj(id){return data.subjects.find(s=>s.id===id)}
function topic(id){return data.topics.find(s=>s.id===id)}
function count(sId,tId){return data.questions.filter(q=>(!sId||q.subjectId===sId)&&(!tId||q.topicId===tId)).length}
function dateText(){return new Intl.DateTimeFormat('he-IL',{day:'numeric',month:'long',year:'numeric'}).format(new Date())}
function progressOf(id){return data.progress[id]||{streak:0,last:0,due:0,attempts:0,correct:0}}
function allStats(){let cards=data.questions.length, due=0, learned=0, tried=0, correct=0;const now=Date.now();for(const q of data.questions){const x=progressOf(q.id);if(x.attempts&&x.due<=now)due++;if(x.streak>=2)learned++;tried+=x.attempts;correct+=x.correct}return{cards,due,learned,tried,correct,rate:tried?Math.round(correct/tried*100):0}}
function navigate(name){view.page=name;view.topic=null;view.quiz=null;view.search='';render();scrollTo({top:0,behavior:'smooth'})}
function heroButtons(){return `<div class="hero-actions"><button class="btn light" data-act="quickquiz">התחל חזרה יומית ←</button><button class="btn outline-light" data-go="map">חקור שרשראות ↗</button></div>`}
function statCard(num,label,symbol){return `<div class="card stat"><div><div class="stat-num">${esc(num)}</div><div class="stat-label">${esc(label)}</div></div><div class="stat-symbol">${symbol}</div></div>`}
function sCard(s){const n=count(s.id),t=data.topics.filter(t=>t.subjectId===s.id).length;return `<div class="card subject-card click-card ${n?'':'empty-subject'}" data-act="opensubject" data-id="${esc(s.id)}"><div class="subj-emoji">${esc(s.emoji)}</div><div class="subject-title">${esc(s.name)}</div><p class="muted" style="font-size:13px">${esc(s.description)}</p><div class="push row between"><span class="topic-count">${t} נושאים · ${n} שאלות</span><span style="color:var(--forest);font-weight:800">←</span></div></div>`}
function renderHome(){let st=allStats(),ss=data.subjects;return `<div class="hero"><div><div class="eyebrow">האטלס שלי / למידה אישית</div><h1>ללמוד. להבין.<br/>לחבר את הנקודות.</h1><p>כל חומרי הלימוד, השאלות והממשקים האנטומיים במקום אחד. נתחיל מסטרוקטורל, ונוסיף מקצועות בקצב שלך.</p>${heroButtons()}</div><div class="hero-orbit"><div class="orbit"><div class="orbit-center">שאלות במאגר<b>${st.cards}</b>מחכות לך</div><i class="orbit-dot d1"></i><i class="orbit-dot d2"></i><i class="orbit-dot d3"></i></div></div></div><div class="section-title"><h2>מצב הלמידה</h2><button class="inline-link" data-go="progress">כל הנתונים ←</button></div><div class="grid g4">${statCard(st.cards,'שאלות במאגר','🗂️')}${statCard(st.due,'לחזרה היום','⏳')}${statCard(st.learned,'שאלות שנלמדו','🌱')}${statCard(st.rate+'%','הצלחה עד כה','✓')}</div><div class="section-title"><h2>המקצועות שלי</h2><button class="btn small" data-go="manage">＋ הוסף חומר</button></div><div class="grid g4">${ss.map(sCard).join('')}</div><div class="section-title"><h2>גישה מהירה</h2></div><div class="grid g2"><div class="card click-card" data-act="openchains"><div class="eyebrow">בתוך סטרוקטורל</div><h3>שרשראות מיופציאליות</h3><p class="muted">מסלולים, נקודות מעבר, פיצויים ומפות אינטראקטיביות.</p><span class="tag">${count('struct','chains')} שאלות</span></div><div class="card click-card" data-go="practice"><div class="eyebrow">חזרה עצמית</div><h3>תרגול בסגנון מבחן</h3><p class="muted">שאלות סגורות, תשובות פתוחות וקייסים. מדרגים את מידת השליטה אחרי כל תשובה.</p><span class="tag terra">התחל לתרגל ←</span></div></div>`}
function subChips(items,active,action){return `<div class="chipbar">${items.map(x=>`<button class="chip ${x.id===active?'active':''}" data-act="${action}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join('')}</div>`}
function renderLibrary(){const s=subj(view.subject)||data.subjects[0];let t=data.topics.filter(x=>x.subjectId===s.id);if(view.topic){return renderTopic()}return `<div class="eyebrow">ספרייה / מקצועות</div><h1>הספרייה שלי</h1><p class="page-sub">כל מקצוע מחולק לנושאים, ובתוך כל נושא נמצאים סיכומים ושאלות. השרשראות הן נושא בתוך סטרוקטורל.</p>${subChips(data.subjects,view.subject,'switchsubject')}<div class="row between wrap" style="margin:25px 0 14px"><h2 style="margin:0">${esc(s.emoji)} ${esc(s.name)}</h2><button class="btn small" data-act="prepaddtopic">＋ נושא חדש</button></div>${t.length?`<div class="topic-list">${t.map(x=>`<button class="topic-row" data-act="opentopic" data-id="${esc(x.id)}"><div><b>${esc(x.name)}</b><div class="muted" style="font-size:12px">${esc(x.description||'')}</div></div><span class="tag light">${count(null,x.id)} שאלות</span></button>`).join('')}</div>`:`<div class="empty"><b>המקצוע הזה מחכה לחומר הראשון שלו</b>אפשר להוסיף נושא, סיכום או שאלות חדשות.<br/><button class="btn primary" style="margin-top:16px" data-act="prepaddtopic">הוסף נושא ראשון ＋</button></div>`}`}
function renderTopic(){const t=topic(view.topic);if(!t){view.topic=null;return renderLibrary()}let notes=data.notes.filter(n=>n.topicId===t.id), qs=data.questions.filter(q=>q.topicId===t.id && (view.libraryType==='all'||q.type===view.libraryType) && (!view.search || q.prompt.toLowerCase().includes(view.search.toLowerCase())));return `<button class="inline-link" data-act="backlibrary">→ חזרה לספרייה</button><div class="eyebrow" style="margin-top:20px">${esc(subj(t.subjectId)?.name)} / נושא</div><h1>${esc(t.name)}</h1><p class="page-sub">${esc(t.description)}</p><div class="row wrap" style="margin:20px 0 27px"><button class="btn primary" data-act="topicquiz" data-id="${esc(t.id)}">תרגל ${count(null,t.id)} שאלות ←</button><button class="btn" data-act="addintopic" data-id="${esc(t.id)}">＋ הוסף שאלה</button></div><div class="section-title"><h2>סיכומי חומר</h2></div>${notes.length?notes.map(n=>`<div class="card" style="margin-bottom:12px"><div class="row between wrap"><h3 style="margin:0">${esc(n.title)}</h3><span class="tag light">מקור: ${esc(n.source||'ללא ציון')}</span></div><p class="note" style="margin:15px 0 0">${esc(n.body)}</p></div>`).join(''):`<div class="empty">אין עדיין סיכום בנושא הזה. אפשר להוסיף חומר.</div>`}<div class="section-title"><h2>מאגר שאלות</h2><span class="tag">${qs.length} שאלות מוצגות</span></div><div class="row wrap" style="margin-bottom:12px"><input aria-label="חפש שאלה" class="input" style="max-width:340px" value="${esc(view.search)}" placeholder="חיפוש בתוך שאלות..." id="topic-search"/><select class="input" id="typefilter" style="max-width:220px"><option value="all">כל סוגי השאלות</option>${Object.entries(TYPE).map(([key,val])=>`<option value="${key}" ${view.libraryType===key?'selected':''}>${val}</option>`).join('')}</select></div>${qs.length?`<div class="quest-list">${qs.map((q,i)=>`<div class="quest-row"><span class="quest-num">${i+1}</span><div class="qtext">${esc(q.prompt)}<div style="margin-top:5px"><span class="tag light">${TYPE[q.type]||q.type}</span></div></div><button class="btn small" data-act="editquestion" data-id="${esc(q.id)}">עריכה</button></div>`).join('')}</div>`:`<div class="empty">לא נמצאו שאלות.</div>`}`}
function filteredQuestions(){let q=data.questions.filter(q=>(view.practiceSubject==='all'||q.subjectId===view.practiceSubject)&&(view.practiceTopic==='all'||q.topicId===view.practiceTopic)&&(view.practiceType==='all'||q.type===view.practiceType));if(view.practiceMode==='due')q=q.filter(x=>!progressOf(x.id).attempts||progressOf(x.id).due<=Date.now());if(view.practiceMode==='new')q=q.filter(x=>!progressOf(x.id).attempts);return q}
function renderPractice(){let available=filteredQuestions(), subTopics=data.topics.filter(t=>view.practiceSubject==='all'||t.subjectId===view.practiceSubject);return `<div class="eyebrow">אימון / חזרה</div><h1>מתרגלים ידע</h1><p class="page-sub">אתה בוחר את המקצוע, הנושא וסוג השאלות. אין ציון כפוי: אחרי בדיקת התשובה אתה מדרג בעצמך מה דורש חזרה.</p><div class="card" style="margin-top:25px"><div class="controls"><div class="field"><label for="practice-subject">מקצוע</label><select class="input" id="practice-subject"><option value="all">כל המקצועות</option>${data.subjects.map(s=>`<option value="${esc(s.id)}" ${view.practiceSubject===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label for="practice-topic">נושא</label><select class="input" id="practice-topic"><option value="all">כל הנושאים</option>${subTopics.map(t=>`<option value="${esc(t.id)}" ${view.practiceTopic===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label for="practice-type">סוג שאלה</label><select class="input" id="practice-type"><option value="all">כל הסוגים</option>${Object.entries(TYPE).map(([k,v])=>`<option value="${k}" ${view.practiceType===k?'selected':''}>${v}</option>`).join('')}</select></div></div><div style="margin-top:23px"><div class="overline">איזה חומר לתרגל?</div><div class="chipbar">${[{id:'all',name:'כל השאלות'},{id:'due',name:'חדשות + לחזרה'},{id:'new',name:'רק שאלות חדשות'}].map(m=>`<button class="chip ${view.practiceMode===m.id?'active':''}" data-act="practicemode" data-id="${m.id}">${m.name}</button>`).join('')}</div></div><div class="row between wrap" style="margin-top:22px"><span class="muted">${available.length} שאלות זמינות לסינון שבחרת</span><button class="btn primary" data-act="startquiz" ${available.length?'':'disabled'}>התחל תרגול ←</button></div></div>${!available.length?`<div class="empty" style="margin-top:20px">אין שאלות מתאימות כרגע. אפשר לבחור סינון אחר או להוסיף חומר חדש.</div>`:''}<div class="grid g2" style="margin-top:22px"><div class="card"><h3>איך מתקדמים?</h3><p class="muted">רב־ברירה ונכון/לא נכון: בוחרים ובודקים תשובה. פתוחות וקייסים: מנסחים תשובה, חושפים דוגמה, ואז מדרגים את הזכירה.</p></div><div class="card"><h3>חזרה חכמה</h3><p class="muted">״צריך לחזור״ מחזיר את השאלה לסבב הקרוב; ״ידעתי״ ו״קל לי״ מגדילים את המרווח עד לפעם הבאה.</p></div></div>`}
function startQuiz(qs){let ids=[...qs.map(x=>x.id)];for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}view.quiz={ids,index:0,selected:null,revealed:false,typed:'',right:0,wrong:0,completed:false};view.page='quiz';render();scrollTo(0,0)}
function renderQuiz(){const v=view.quiz;if(!v)return renderPractice();if(v.completed){return `<div class="quiz-main"><div class="eyebrow">סיום סבב לימוד</div><div class="card" style="text-align:center;padding:38px"><div style="font-size:52px">🌿</div><h1>סבב הושלם</h1><p class="muted">עברת על ${v.ids.length} שאלות. ${v.right} סומנו כידועות ו-${v.wrong} ככאלה שדורשות חזרה.</p><div class="row wrap" style="justify-content:center;margin-top:25px"><button class="btn primary" data-act="quizagain">סבב נוסף</button><button class="btn" data-go="progress">צפייה בהתקדמות</button><button class="btn" data-go="home">למסך הבית</button></div></div></div>`}const q=data.questions.find(x=>x.id===v.ids[v.index]);if(!q){view.quiz=null;view.page='practice';return renderPractice()}let opts=q.type==='tf'?['נכון','לא נכון']:q.options;let hasChoices=q.type==='mcq'||q.type==='tf',isCorrect=String(v.selected)===String(q.answer);return `<div class="quiz-main"><div class="quiz-header"><button class="inline-link" data-act="quitquiz">סיום התרגול ×</button><span class="tag">${v.index+1} מתוך ${v.ids.length}</span></div><div class="progress-track"><div style="width:${(v.index/v.ids.length)*100}%"></div></div><div class="card" style="margin-top:18px;padding:27px"><div class="row wrap"><span class="tag light">${esc(topic(q.topicId)?.name||'נושא')}</span><span class="tag terra">${esc(TYPE[q.type])}</span><span class="tag light">${esc(q.difficulty||'')}</span></div><div class="quiz-prompt">${esc(q.prompt)}</div>${hasChoices?`<div class="choices">${opts.map((o,i)=>{let correct=String(o)===String(q.answer),classes=[v.selected===o?'selected':'',v.revealed&&correct?'correct':'',v.revealed&&v.selected===o&&!correct?'wrong':''].join(' ');return `<button class="choice ${classes}" data-act="choose" data-value="${esc(o)}" ${v.revealed?'disabled':''}><span class="choice-letter">${i+1}</span>${esc(o)}</button>`}).join('')}</div>`:`<div class="field"><label>נסח את התשובה שלך (אופציונלי)</label><textarea class="textarea" id="quiz-typed" placeholder="מה היית עונה בבחינה?" ${v.revealed?'disabled':''}>${esc(v.typed||'')}</textarea></div>`}${!v.revealed?`<button class="btn primary" data-act="revealanswer" ${hasChoices&&v.selected===null?'disabled':''}>${hasChoices?'בדוק תשובה':'הצג תשובה להשוואה'}</button>`:`<div class="answer-area"><span class="tag">${hasChoices?(isCorrect?'תשובה נכונה':'תשובה שונה'):'תשובת המקור'}</span><div style="margin-top:8px"><strong>${esc(q.answer)}</strong></div>${q.explanation?`<p style="margin-top:12px">${esc(q.explanation)}</p>`:''}<small class="muted">מקור: ${esc(q.source||'הזנה ידנית')}</small></div><div class="overline" style="margin-top:20px">עד כמה שלטת בתשובה?</div><div class="grade-buttons"><button class="btn danger" data-act="grade" data-grade="again">צריך לחזור</button><button class="btn" data-act="grade" data-grade="good">ידעתי</button><button class="btn primary" data-act="grade" data-grade="easy">קל לי</button></div>`}</div></div>`}
function renderMap(){let nd=data.nodes.find(n=>n.id===view.selectedNode)||data.nodes[0];const chosen=view.selectedChain==='all'?data.nodes:data.nodes.filter(n=>n.chains.includes(view.selectedChain));const focus=data.chainDetails[view.selectedChain];return `<div class="eyebrow">סטרוקטורל / שרשראות מיופציאליות</div><h1>מפת ממשקים אינטראקטיבית</h1><p class="page-sub">במקום גרף עמוס: בוחרים נקודה על גוף סכמטי או מסננים לפי שרשרת, ומקבלים את פירוט המפגש והפיצויים.</p><div class="chain-btns"><button class="chainbtn ${view.selectedChain==='all'?'active':''}" data-act="chainfilter" data-id="all">כל השרשראות</button>${Object.keys(data.chainDetails).map(k=>`<button class="chainbtn ${view.selectedChain===k?'active':''}" data-act="chainfilter" data-id="${k}">${k}</button>`).join('')}</div><div class="map-layout"><div class="map-paper"><div class="overline" style="text-align:center">לחץ על נקודת מפגש</div><svg viewBox="0 0 350 565" role="img" aria-label="גוף סכמטי ועליו נקודות מפגש ניתנות ללחיצה"><defs><linearGradient id="bgshape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf4ee"/><stop offset="1" stop-color="#e0ebe2"/></linearGradient></defs><g fill="url(#bgshape)" stroke="#c2d6c7" stroke-width="2.2"><ellipse cx="175" cy="65" rx="39" ry="49"/><path d="M149 104L145 120 108 136 89 182 98 220 115 225 133 164 135 269 127 312 145 351 133 436 119 502 111 522 136 528 162 445 173 357 183 357 196 446 218 528 242 525 233 502 218 434 210 351 231 312 218 268 215 164 235 225 251 222 264 180 242 139 203 122 200 105Z"/><path d="M151 123L175 134 199 123" fill="none"/><path d="M175 135L175 351" fill="none" stroke="#d0dfd2" stroke-dasharray="5 7"/></g><g stroke="#b5cbb8" stroke-width="1" opacity=".65"><path d="M133 169Q175 150 215 169" fill="none"/><path d="M134 244Q175 256 217 244" fill="none"/><path d="M135 310Q175 294 215 310" fill="none"/></g>${data.nodes.filter(n=>view.selectedChain==='all'||n.chains.includes(view.selectedChain)).map((n,i)=>`<g class="map-node ${n.id===view.selectedNode?'active':''}" data-act="mapnode" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}"><circle cx="${n.x}" cy="${n.y}" r="13"/><text x="${n.x}" y="${n.y+1}">${i+1}</text></g>`).join('')}</svg><div class="map-key">תרשים סכמטי להדגמת אזורים בלבד. אינו מפה אנטומית מדויקת.</div></div><div class="side-rail">${focus?`<div class="card" style="background:#edf3ec"><div class="eyebrow">שרשרת נבחרת · ${esc(view.selectedChain)}</div><h2>${esc(focus.name)}</h2><p>${esc(focus.summary)}</p><div class="overline">מסלול מקוצר</div><p>${esc(focus.focus)}</p><div class="overline">פיצויים מתוארים בחומר</div><ul class="bullet-list">${focus.comp.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="card"><div class="row between"><div class="eyebrow" style="margin:0">מוקד נבחר</div><span class="tag terra">${esc(nd.kind)}</span></div><h2 style="margin:12px 0">${esc(nd.name)}</h2><p>${esc(nd.desc)}</p><div class="overline">שרשראות קשורות</div><div class="row wrap">${nd.chains.map(c=>`<button class="chainbtn" data-act="chainfilter" data-id="${esc(c)}">${esc(c)}</button>`).join('')}</div></div><div class="card"><h3>נקודות נוספות</h3><div class="quest-list">${chosen.map(n=>`<button class="topic-row" data-act="mapnode" data-id="${esc(n.id)}" style="padding:10px 12px;border-color:${n.id===nd.id?'#4e8b74':'var(--border)'}"><span>${esc(n.name)}</span><span class="tag light">${esc(n.kind)}</span></button>`).join('')}</div></div></div></div><div class="credit">הפרשנות מבוססת על פרק השרשראות במסמך "קינזיולוגיה". קשרים תפקודיים מסומנים בנפרד ממפגש אנטומי ישיר.</div>`}

function renderManage(){return `<div class="eyebrow">ספרייה / עריכה</div><h1>מוסיפים ידע</h1><p class="page-sub">כאן אפשר להוסיף מקצוע, נושא, סיכום ושאלות מכל סוג. הנתונים נשמרים בדפדפן המקומי במכשיר שבו עובדים.</p><div class="card" style="margin-top:22px"><div class="tabs">${[{id:'question',name:'שאלה חדשה'},{id:'note',name:'סיכום / חומר'},{id:'topic',name:'נושא חדש'},{id:'subject',name:'מקצוע חדש'}].map(t=>`<button class="tab ${view.manageTab===t.id?'active':''}" data-act="managetab" data-id="${t.id}">${t.name}</button>`).join('')}</div>${view.manageTab==='subject'?`<form id="form-subject" class="form-grid"><div class="form-row"><div class="field"><label>שם המקצוע</label><input class="input" name="name" required maxlength="90" placeholder="למשל: קרניאל"/></div><div class="field"><label>סמל (אימוג׳י)</label><input class="input" name="emoji" maxlength="4" placeholder="📚" value="📚"/></div></div><div class="field"><label>תיאור קצר</label><input class="input" name="description" maxlength="160" placeholder="מה נלמד במקצוע הזה?"/></div><button class="btn primary" type="submit">הוסף מקצוע</button></form>`:view.manageTab==='topic'?`<form id="form-topic" class="form-grid"><div class="field"><label>מקצוע</label><select class="input" name="subjectId">${data.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===view.subject?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>שם הנושא</label><input class="input" name="name" required maxlength="130" placeholder="למשל: אגן / SIJ"/></div><div class="field"><label>תיאור</label><input class="input" name="description" maxlength="180" placeholder="כמה מילים על הנושא"/></div><button class="btn primary" type="submit">הוסף נושא</button></form>`:view.manageTab==='note'?`<form id="form-note" class="form-grid"><div class="field"><label>נושא</label><select class="input" name="topicId" required>${data.topics.map(t=>`<option value="${esc(t.id)}" ${t.id===view.topic?'selected':''}>${esc(subj(t.subjectId)?.name)} / ${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>כותרת</label><input class="input" name="title" required maxlength="180" placeholder="שם הסיכום"/></div><div class="field"><label>הדבק כאן את החומר</label><textarea class="textarea" name="body" rows="12" required placeholder="רשימות, סיכומים, נקודות ממצגת... ניתן גם להדביק טקסט ארוך."></textarea></div><div class="field"><label>מקור</label><input class="input" name="source" placeholder="שם המצגת, שיעור או מסמך"/></div><button class="btn primary" type="submit">שמור סיכום</button></form>`:questionForm(null)}</div><div class="danger-line" style="margin-top:18px"><b>חשוב:</b> גרסה זו אינה מפענחת PDF או מצגות באופן אוטומטי. אפשר להעתיק אליה טקסט וליצור שאלות, ובהמשך נוסיף ייבוא חכם דרך שרת.</div>`}
function questionForm(q){let t=q?.topicId||view.topic||data.topics[0]?.id;return `<form id="form-question" class="form-grid"><input type="hidden" name="existingId" value="${esc(q?.id||'')}"/><div class="form-row"><div class="field"><label>נושא</label><select class="input" name="topicId" required>${data.topics.map(x=>`<option value="${esc(x.id)}" ${t===x.id?'selected':''}>${esc(subj(x.subjectId)?.name)} / ${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>סוג שאלה</label><select class="input" name="type" id="question-type">${Object.entries(TYPE).map(([key,v])=>`<option value="${key}" ${q?.type===key?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="field"><label>נוסח השאלה</label><textarea class="textarea" rows="3" name="prompt" required placeholder="כתוב שאלה...">${esc(q?.prompt||'')}</textarea></div><div class="field" id="options-field"><label>אפשרויות (בשאלה רב־ברירה בלבד, אפשרות בשורה)</label><textarea class="textarea" rows="4" name="options" placeholder="אפשרות 1&#10;אפשרות 2&#10;אפשרות 3&#10;אפשרות 4">${esc(q?.options?.join('\n')||'')}</textarea></div><div class="field"><label>תשובה נכונה / תשובת מודל</label><input class="input" name="answer" required value="${esc(q?.answer||'')}" placeholder="בהיגד נכון/לא נכון: כתוב 'נכון' או 'לא נכון'"/><small class="muted">ברב־ברירה, יש להעתיק בדיוק אחת מהאפשרויות לתשובה הנכונה.</small></div><div class="field"><label>הסבר (אופציונלי)</label><textarea class="textarea" rows="3" name="explanation" placeholder="מדוע זו התשובה?">${esc(q?.explanation||'')}</textarea></div><div class="form-row"><div class="field"><label>מקור</label><input class="input" name="source" value="${esc(q?.source||'הוזן ידנית')}" placeholder="מצגת / שיעור / PDF"/></div><div class="field"><label>רמת קושי</label><select class="input" name="difficulty">${['קל','בינוני','מתקדם'].map(d=>`<option value="${d}" ${q?.difficulty===d?'selected':''}>${d}</option>`).join('')}</select></div></div><div class="form-actions"><button class="btn primary" type="submit">${q?'שמור שינויים':'הוסף שאלה'}</button>${q?`<button class="btn danger" type="button" data-act="deletequestion" data-id="${esc(q.id)}">מחיקת שאלה</button>`:''}</div></form>`}
function renderProgress(){let st=allStats(),bars=data.subjects.map(s=>{let total=count(s.id),known=data.questions.filter(q=>q.subjectId===s.id&&progressOf(q.id).streak>=2).length;return {s,total,known}});let history=(data.activity||[]).slice(-9).reverse();return `<div class="eyebrow">לימוד אישי / התקדמות</div><h1>ההתקדמות שלי</h1><p class="page-sub">הנתונים שלך מתעדכנים ככל שתתרגל. חזרות מבוססות על הדירוג העצמי שלך אחרי כל שאלה.</p><div class="grid g4" style="margin:24px 0">${statCard(st.cards,'שאלות במאגר','🗂️')}${statCard(st.learned,'נלמדו היטב','🌱')}${statCard(st.due,'ממתינות לחזרה','⏳')}${statCard(st.rate+'%','שיעור דיוק במדידה עצמית','✓')}</div><div class="grid g2"><div class="card"><h3>התקדמות לפי מקצוע</h3><div class="bar-data">${bars.map(({s,total,known})=>`<div class="bar-item"><b>${esc(s.name)}</b><div class="bar"><span style="width:${total?100*known/total:0}%"></span></div><span>${known}/${total}</span></div>`).join('')}</div></div><div class="card"><h3>חזרות אחרונות</h3>${history.length?history.map(a=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--border)"><span>${esc(topic(a.topicId)?.name||'לימוד')}<small class="muted" style="display:block">${new Date(a.ts).toLocaleDateString('he-IL')}</small></span><span class="tag ${a.grade==='again'?'terra':''}">${a.grade==='again'?'לחזור':a.grade==='easy'?'קל':'ידעתי'}</span></div>`).join(''):`<div class="empty">אחרי הסבב הראשון יופיע כאן יומן חזרות.</div>`}</div></div><div style="margin-top:19px" class="card"><h3>איך מחושבת חזרה?</h3><p class="muted">שאלה חדשה מופיעה בסבב רגיל. אם סימנת ״צריך לחזור״, היא תהפוך לזמינה שוב. דירוג ״ידעתי״ מתזמן חזרה לאחר פרק זמן קצר ודירוג ״קל לי״ מאריך את המרווח בהדרגה. האלגוריתם פשוט ומותאם לגרסת הניסיון.</p></div>`}
function renderSettings(){return `<div class="eyebrow">הגדרות / שמירת חומר</div><h1>הנתונים שלי</h1><p class="page-sub">גרסה אישית מקומית. אפשר לבצע גיבוי כקובץ JSON ולייבא אותו בדפדפן אחר. אין עדיין חשבון משתמש או סנכרון אוטומטי.</p><div class="grid g2" style="margin-top:25px"><div class="card"><h3>גיבוי כל חומר הלימוד</h3><p class="muted">מקצועות, נושאים, שאלות, סיכומים והתקדמות.</p><button class="btn primary" data-act="exportdata">↓ הורד גיבוי JSON</button></div><div class="card"><h3>שחזור מגיבוי</h3><p class="muted">ייבוא מחליף את הנתונים המקומיים אחרי אישור.</p><label class="btn" for="import-file">↑ בחר קובץ JSON</label><input type="file" id="import-file" accept=".json,application/json" style="display:none"/></div></div><div class="card" style="margin-top:17px"><h3>העתקת חומר בעתיד</h3><p class="muted">את הקובץ ניתן לשמור בדרייב ולייבא למחשב או לאייפד אחר. בגרסה הבאה אפשר להוסיף אחסון מאובטח וסנכרון קבוע.</p><p class="muted">מומלץ לייצא גיבוי לאחר הוספת חומר משמעותי.</p></div><div class="danger-line" style="margin-top:18px"><div class="row between wrap"><div><b>איפוס לגרסת ההתחלה</b><br/>מחזיר את הדוגמה המקורית ומוחק חומר נוסף והתקדמות.</div><button class="btn danger" data-act="resetdata">אפס נתונים</button></div></div>`}
function modal(html){const e=document.createElement('div');e.className='modal-backdrop';e.id='modal-backdrop';e.innerHTML=`<div class="modal"><div class="row between" style="margin-bottom:18px"><h2 style="margin:0">עריכת שאלה</h2><button class="btn small" data-act="closemodal">סגור ×</button></div>${html}</div>`;document.body.appendChild(e)}
function render(){let st=allStats();let pages={home:renderHome,library:renderLibrary,practice:renderPractice,quiz:renderQuiz,map:renderMap,manage:renderManage,progress:renderProgress,settings:renderSettings};let c=(pages[view.page]||renderHome)();document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><span class="logo-mark">א</span><div><div class="logo-name">האטלס שלי</div><div class="logo-sub">אתר לימוד אישי</div></div></div><nav class="nav">${navItems().map(item=>`<button class="nav-btn ${view.page===item.id||(view.page==='quiz'&&item.id==='practice')?'active':''}" data-go="${item.id}"><span class="nav-icon">${item.icon}</span>${item.name}</button>`).join('')}</nav><div class="side-foot"><strong>מצב אישי</strong><br/>${st.cards} שאלות במאגר · ${st.due} לחזרה<br/><span style="opacity:.75">הנתונים נשמרים במכשיר זה בלבד</span></div></aside><main class="content"><header class="top"><div><div class="top-title">האטלס שלי / ${TITLES[view.page]||'תרגול'}</div><div class="top-date">${dateText()}</div></div><div class="userpill"><button class="btn small" data-go="settings" title="נתונים וגיבוי">⚙ גיבוי</button><span class="usercircle">י</span></div></header><section class="container" id="main-area">${c}</section></main></div><nav class="mobile-nav">${navItems().slice(0,5).map(item=>`<button class="${view.page===item.id||(view.page==='quiz'&&item.id==='practice')?'active':''}" data-go="${item.id}"><span>${item.icon}</span>${item.short}</button>`).join('')}</nav>`}
function navItems(){return [{id:'home',name:'ראשי',short:'ראשי',icon:'◫'},{id:'library',name:'ספריית נושאים',short:'ספרייה',icon:'▤'},{id:'practice',name:'תרגול שאלות',short:'תרגול',icon:'✎'},{id:'map',name:'מפת שרשראות',short:'מפה',icon:'◎'},{id:'manage',name:'הוספת חומר',short:'הוסף',icon:'＋'},{id:'progress',name:'התקדמות',short:'התקדמות',icon:'▥'},{id:'settings',name:'גיבוי והגדרות',short:'הגדרות',icon:'⚙'}]}
function toast(msg){document.getElementById('toast')?.remove();let n=document.createElement('div');n.className='toast';n.id='toast';n.textContent=msg;document.body.appendChild(n);setTimeout(()=>n.remove(),3300)}
function manageSubmit(form){const fd=new FormData(form);const get=k=>String(fd.get(k)||'').trim();let id='id-'+Math.random().toString(36).slice(2,10);if(form.id==='form-subject'){if(!get('name'))return;data.subjects.push({id,name:get('name'),description:get('description'),emoji:get('emoji')||'📚'});view.subject=id;view.manageTab='topic';toast('המקצוע נוסף');}else if(form.id==='form-topic'){data.topics.push({id,subjectId:get('subjectId'),name:get('name'),description:get('description')});view.subject=get('subjectId');view.topic=id;view.manageTab='question';toast('הנושא נוסף');}else if(form.id==='form-note'){data.notes.push({id,topicId:get('topicId'),title:get('title'),body:get('body'),source:get('source')||'הוזן ידנית'});view.topic=get('topicId');toast('הסיכום נשמר');}else if(form.id==='form-question'){const t=topic(get('topicId'));if(!t)return toast('יש לבחור נושא קיים');let opts=get('options').split(/\n+/).map(s=>s.trim()).filter(Boolean),typ=get('type'),answer=get('answer');if(typ==='mcq'&&(opts.length<2||!opts.includes(answer)))return toast('ברב־ברירה נדרשות לפחות שתי אפשרויות ותשובה זהה לאחת מהן.');if(typ==='tf'&&!['נכון','לא נכון'].includes(answer))return toast('בתשובת נכון/לא נכון יש לכתוב ״נכון״ או ״לא נכון״.');let rec={id:get('existingId')||id,subjectId:t.subjectId,topicId:t.id,type:typ,prompt:get('prompt'),answer,options:typ==='mcq'?opts:[],explanation:get('explanation'),source:get('source')||'הוזן ידנית',difficulty:get('difficulty'),userCreated:!get('existingId'),createdAt:new Date().toISOString().slice(0,10)};let idx=data.questions.findIndex(q=>q.id===rec.id);if(idx>=0){rec.userCreated=data.questions[idx].userCreated;data.questions[idx]=rec;toast('השאלה עודכנה')}else{data.questions.push(rec);toast('השאלה נוספה')}document.getElementById('modal-backdrop')?.remove()}save();render()}
function gradeQuestion(g){let v=view.quiz,q=data.questions.find(x=>x.id===v.ids[v.index]),prev=progressOf(q.id);let streak=g==='again'?0:prev.streak+1;let delay=g==='again'?0:g==='good'? Math.max(1,Math.pow(2,Math.max(0,streak-1))) : Math.max(3,Math.pow(3,Math.max(1,streak)));data.progress[q.id]={streak,due:Date.now()+delay*86400000,last:Date.now(),attempts:(prev.attempts||0)+1,correct:(prev.correct||0)+(g==='again'?0:1)};data.activity.push({ts:Date.now(),qId:q.id,topicId:q.topicId,grade:g});if(data.activity.length>300)data.activity=data.activity.slice(-300);if(g==='again')v.wrong++;else v.right++;v.index++;v.selected=null;v.revealed=false;v.typed='';if(v.index>=v.ids.length)v.completed=true;save();render();scrollTo(0,0)}
function download(name,content,mime){const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-act]');if(!el)return;const go=el.dataset.go;if(go){navigate(go);return}const action=el.dataset.act,id=el.dataset.id,value=el.dataset.value;switch(action){case'quickquiz':{let q=data.questions.filter(x=>!progressOf(x.id).attempts||progressOf(x.id).due<=Date.now()).slice(0,20);startQuiz(q.length?q:data.questions.slice(0,20));break}case'openchains':view.subject='struct';view.topic='chains';view.page='library';render();break;case'opensubject':view.subject=id;view.topic=null;view.page='library';render();break;case'switchsubject':view.subject=id;view.topic=null;render();break;case'opentopic':view.topic=id;view.search='';view.libraryType='all';render();break;case'backlibrary':view.topic=null;view.search='';render();break;case'topicquiz':startQuiz(data.questions.filter(q=>q.topicId===id));break;case'prepaddtopic':view.page='manage';view.manageTab='topic';view.topic=null;render();break;case'addintopic':view.page='manage';view.manageTab='question';view.topic=id;render();break;case'practicemode':view.practiceMode=id;render();break;case'startquiz':startQuiz(filteredQuestions());break;case'choose':if(!view.quiz?.revealed){view.quiz.selected=value;render()}break;case'revealanswer':if(view.quiz){const inp=document.getElementById('quiz-typed');if(inp)view.quiz.typed=inp.value;view.quiz.revealed=true;render()}break;case'grade':gradeQuestion(el.dataset.grade);break;case'quitquiz':if(confirm('לצאת מהתרגול הנוכחי? ההתקדמות בשאלות שכבר דורגו נשמרת.'))navigate('practice');break;case'quizagain':view.quiz=null;view.page='practice';render();break;case'chainfilter':view.selectedChain=id;let possible=data.nodes.filter(n=>id==='all'||n.chains.includes(id));if(!possible.some(n=>n.id===view.selectedNode))view.selectedNode=possible[0]?.id;render();break;case'mapnode':view.selectedNode=id;render();break;case'managetab':view.manageTab=id;render();break;case'editquestion':{let q=data.questions.find(q=>q.id===id);if(q)modal(questionForm(q));break}case'closemodal':document.getElementById('modal-backdrop')?.remove();break;case'deletequestion':if(confirm('למחוק את השאלה הזו?')){data.questions=data.questions.filter(q=>q.id!==id);delete data.progress[id];save();document.getElementById('modal-backdrop')?.remove();render();toast('השאלה נמחקה')}break;case'exportdata':download('study-atlas-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('הגיבוי מוכן להורדה');break;case'resetdata':if(confirm('לאפס את כל הנתונים המקומיים? פעולה זו מוחקת שאלות שהוספת, סיכומים והתקדמות.')){data=structuredClone(SEED);save();navigate('home');toast('חזרנו לגרסת ההתחלה')}break;}});
document.addEventListener('submit',e=>{if(e.target.id.startsWith('form-')){e.preventDefault();manageSubmit(e.target)}});
document.addEventListener('change',async e=>{const el=e.target;if(el.id==='practice-subject'){view.practiceSubject=el.value;view.practiceTopic='all';render()}if(el.id==='practice-topic'){view.practiceTopic=el.value;render()}if(el.id==='practice-type'){view.practiceType=el.value;render()}if(el.id==='typefilter'){view.libraryType=el.value;render()}if(el.id==='import-file'&&el.files?.[0]){try{const txt=await el.files[0].text(),obj=JSON.parse(txt);if(!obj||obj.schemaVersion!==1||!Array.isArray(obj.subjects)||!Array.isArray(obj.topics)||!Array.isArray(obj.questions)||!Array.isArray(obj.notes)||!obj.progress||!Array.isArray(obj.nodes)||!obj.chainDetails)throw Error('מבנה הקובץ אינו מתאים');if(!confirm(`להחליף את הנתונים המקומיים בגיבוי עם ${obj.questions.length} שאלות?`))return;data=obj;data.activity=Array.isArray(data.activity)?data.activity:[];save();navigate('home');toast('הנתונים יובאו בהצלחה')}catch(err){toast('לא ניתן לקרוא את קובץ הגיבוי: '+err.message)}}});
document.addEventListener('input',e=>{if(e.target.id==='topic-search'){let selection=e.target.selectionStart;view.search=e.target.value;let el=document.getElementById('main-area');el.outerHTML=`<section class="container" id="main-area">${renderTopic()}</section>`;let input=document.getElementById('topic-search');input.focus();input.setSelectionRange(selection,selection)}if(e.target.id==='quiz-typed'&&view.quiz)view.quiz.typed=e.target.value});
document.addEventListener('keydown',e=>{let el=e.target.closest('[data-act="mapnode"]');if(el&&(e.key==='Enter'||e.key===' ')){e.preventDefault();view.selectedNode=el.dataset.id;render()}});
render();
})();
</script>
